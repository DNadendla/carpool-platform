spring:
  application:
    name: carpool-test

  datasource:
    url: jdbc:h2:mem:carpool_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-for-jwt-testing-only-very-long-256-bit-key
  expiration: 3600000
  refresh-expiration: 3600000

geoapify:
  api-key: test-api-key
  base-url: https://api.geoapify.com
  url-path: /v1/geocode/autocomplete