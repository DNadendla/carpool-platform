<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Register - Carpool</title>

  <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
        }

        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .register-container {
            width: 100%;
            max-width: 1050px;
            min-height: 650px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 45% 55%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
        }

        /* =========================
           LEFT SECTION
           ========================= */

        .register-left {
            background: linear-gradient(
                145deg,
                #2563eb,
                #1d4ed8,
                #0f766e
            );

            color: white;
            padding: 55px 45px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 45px;
        }

        .brand span {
            margin-right: 8px;
        }

        .register-left h1 {
            font-size: 42px;
            line-height: 1.15;
            margin: 0 0 20px;
        }

        .register-left p {
            font-size: 17px;
            line-height: 1.7;
            opacity: 0.92;
            max-width: 400px;
            margin-bottom: 35px;
        }

        .benefit {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        .benefit-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* =========================
           RIGHT SECTION
           ========================= */

        .register-right {
            padding: 50px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-header h2 {
            margin: 0 0 8px;
            color: #1f2937;
            font-size: 30px;
        }

        .form-header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-input {
            padding-right: 48px !important;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            color: #6b7280;
        }

        .name-phone-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .register-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .register-button:hover {
            background: #1d4ed8;
        }

        .register-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .success-message {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .login-link a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 800px) {

            .register-page {
                padding: 15px;
            }

            .register-container {
                grid-template-columns: 1fr;
            }

            .register-left {
                display: none;
            }

            .register-right {
                padding: 40px 25px;
            }
        }

        @media (max-width: 500px) {

            .name-phone-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .register-right {
                padding: 30px 20px;
            }
        }

    </style>

</head>

<body>

<div class="register-page">

  <div class="register-container">

    <!-- =========================
         LEFT SIDE
         ========================= -->

    <div class="register-left">

      <div class="brand">
        <span>🚗</span>
        Carpool
      </div>

      <h1>
        Your journey starts here.
      </h1>

      <p>
        Create your Carpool account and connect
        with people heading your way.
      </p>

      <div class="benefit">
        <div class="benefit-icon">🚗</div>
        <span>Find and share rides easily</span>
      </div>

      <div class="benefit">
        <div class="benefit-icon">🌱</div>
        <span>Travel together and reduce costs</span>
      </div>

      <div class="benefit">
        <div class="benefit-icon">🤝</div>
        <span>Connect with fellow travelers</span>
      </div>

    </div>


    <!-- =========================
         RIGHT SIDE
         ========================= -->

    <div class="register-right">

      <div class="form-header">

        <h2>Create Account</h2>

        <p>
          Join Carpool and start sharing your journey.
        </p>

      </div>


      <!-- Error -->

      <div id="errorMessage"
           class="message error-message">
      </div>


      <!-- Success -->

      <div id="successMessage"
           class="message success-message">
      </div>


      <form id="registerForm">

        <!-- Name + Phone -->

        <div class="name-phone-row">

          <div class="form-group">

            <label for="name">
              Full Name
            </label>

            <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required>

          </div>


          <div class="form-group">

            <label for="phone">
              Phone
            </label>

            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    autocomplete="tel"
                    required>

          </div>

        </div>


        <!-- Email -->

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required>

        </div>


        <!-- Password -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required>

            <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword">
              👁
            </button>

          </div>

        </div>


        <!-- Confirm Password -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="input-wrapper">

            <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="password-input"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required>

            <button
                    type="button"
                    class="toggle-password"
                    id="toggleConfirmPassword">
              👁
            </button>

          </div>

        </div>


        <button
                type="submit"
                id="registerButton"
                class="register-button">

                    <span id="registerButtonText">
                        Create Account
                    </span>

        </button>

      </form>


      <div class="login-link">

        Already have an account?

        <a href="/login">
          Login
        </a>

      </div>

    </div>

  </div>

</div>


<script src="/js/register.js"></script>

</body>

</html>
