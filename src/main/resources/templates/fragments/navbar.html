<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<nav class="cp-navbar"
     th:fragment="nav">

    <!-- =====================================================
         BRAND
         ===================================================== -->

    <a href="/home"
       class="cp-brand">

        <span class="cp-brand-icon">
            🚗
        </span>

        <span class="cp-brand-text">
            Carpool
        </span>

    </a>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <div class="cp-nav-links">


        <!-- HOME -->

        <a href="/home"
           class="cp-nav-link"
           data-page="/home">

            <span class="cp-nav-icon">
                🏠
            </span>

            <span>
                Home
            </span>

        </a>


        <!-- USERS -->

        <a href="/users"
           class="cp-nav-link"
           data-page="/users">

            <span class="cp-nav-icon">
                👥
            </span>

            <span>
                Users
            </span>

        </a>


        <!-- VEHICLES -->

        <a href="/vehicles"
           class="cp-nav-link"
           data-page="/vehicles">

            <span class="cp-nav-icon">
                🚙
            </span>

            <span>
                Vehicles
            </span>

        </a>


        <!-- =================================================
             RIDES DROPDOWN
             ================================================= -->

        <div class="cp-rides-menu"
             data-page="/rides">

            <button
                    type="button"
                    class="cp-nav-link cp-rides-trigger"
                    aria-haspopup="true"
                    aria-expanded="false">

                <span class="cp-nav-icon">
                    🛣️
                </span>

                <span>
                    Rides
                </span>

                <span class="cp-dropdown-arrow">
                    ▾
                </span>

            </button>


            <!-- DROPDOWN -->

            <div class="cp-rides-dropdown">


                <!-- FIND A RIDE -->

                <a href="/rides"
                   class="cp-dropdown-item"
                   data-dropdown-page="/rides">

                    <span class="cp-dropdown-icon">
                        🔍
                    </span>

                    <span class="cp-dropdown-content">

                        <span class="cp-dropdown-title">
                            Find a Ride
                        </span>

                        <span class="cp-dropdown-description">
                            Browse available rides
                        </span>

                    </span>

                </a>


                <!-- MY RIDES -->

                <a href="/rides/my"
                   class="cp-dropdown-item"
                   data-dropdown-page="/rides/my">

                    <span class="cp-dropdown-icon">
                        🚗
                    </span>

                    <span class="cp-dropdown-content">

                        <span class="cp-dropdown-title">
                            My Rides
                        </span>

                        <span class="cp-dropdown-description">
                            Manage rides you offer
                        </span>

                    </span>

                </a>

            </div>

        </div>


        <!-- BOOKINGS -->

        <a href="/bookings"
           class="cp-nav-link"
           data-page="/bookings">

            <span class="cp-nav-icon">
                🎫
            </span>

            <span>
                Bookings
            </span>

        </a>


        <!-- THEME -->

        <button
                type="button"
                id="themeToggle"
                class="theme-toggle"
                aria-label="Toggle theme"
                title="Toggle theme">

            <span id="themeIcon">
                ☀️
            </span>

        </button>


        <!-- LOGOUT -->

        <a href="/login"
           id="logoutButton"
           class="cp-nav-link cp-logout-link">

            <span class="cp-nav-icon">
                ↪
            </span>

            <span>
                Logout
            </span>

        </a>

    </div>

</nav>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const currentPath =
                window.location.pathname;


            /*
             * Normal navigation links
             */

            const navLinks =
                document.querySelectorAll(
                    ".cp-nav-link[data-page]"
                );


            navLinks.forEach(function (link) {

                const page =
                    link.getAttribute("data-page");


                if (
                    currentPath === page ||
                    currentPath.startsWith(page + "/")
                ) {

                    link.classList.add("active");

                }

            });


            /*
             * Rides dropdown
             */

            const ridesMenu =
                document.querySelector(
                    ".cp-rides-menu"
                );


            const ridesTrigger =
                document.querySelector(
                    ".cp-rides-trigger"
                );


            if (!ridesMenu || !ridesTrigger) {
                return;
            }


            /*
             * Keep Rides active for:
             *
             * /rides
             * /rides/my
             * /rides/123
             */

            if (
                currentPath === "/rides" ||
                currentPath.startsWith("/rides/")
            ) {

                ridesTrigger.classList.add("active");

            }


            /*
             * Mark dropdown item active
             */

            const dropdownItems =
                ridesMenu.querySelectorAll(
                    ".cp-dropdown-item"
                );


            dropdownItems.forEach(function (item) {

                const page =
                    item.getAttribute(
                        "data-dropdown-page"
                    );


                if (
                    currentPath === page ||
                    currentPath.startsWith(page + "/")
                ) {

                    item.classList.add("active");

                }

            });


            /*
             * Keyboard accessibility
             */

            ridesTrigger.addEventListener(
                "click",
                function () {

                    const expanded =
                        ridesTrigger.getAttribute(
                            "aria-expanded"
                        ) === "true";


                    ridesTrigger.setAttribute(
                        "aria-expanded",
                        String(!expanded)
                    );


                    ridesMenu.classList.toggle(
                        "open",
                        !expanded
                    );

                }
            );


            /*
             * Close when clicking elsewhere
             */

            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !ridesMenu.contains(event.target)
                    ) {

                        ridesMenu.classList.remove(
                            "open"
                        );

                        ridesTrigger.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }
            );

        }
    );

</script>

</body>

</html>
