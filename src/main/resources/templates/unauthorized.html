<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Authentication Required - Carpool</title>

  <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 45px 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #fff3cd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            margin: 0 0 15px;
            color: #1f2937;
            font-size: 28px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
        }

        .login-button {
            background: #2563eb;
            color: white;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .back-button {
            background: #e5e7eb;
            color: #374151;
        }

        .back-button:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="error-container">

  <div class="icon">
    🔒
  </div>

  <h1>Authentication Required</h1>

  <p>
    You need to be logged in to access this page.
    Please login to continue using the Carpool application.
  </p>

  <div class="button-group">

    <button class="back-button" onclick="history.back()">
      ← Back
    </button>

    <button class="login-button" onclick="window.location.href='/login'">
      Go to Login
    </button>

  </div>

</div>
<script src="/js/logout.js"></script>
</body>
</html>
