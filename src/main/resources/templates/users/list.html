<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users - Carpool</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>

<div th:replace="~{fragments/navbar :: nav}"></div>


<main class="container">


    <!-- Page Header -->

    <div class="page-header">

        <div>

            <h1>Users</h1>

            <p>
                Manage registered Carpool users
            </p>

        </div>


        <a href="/users/new"
           class="btn btn-primary">

            + Add User

        </a>

    </div>


    <!-- Message -->

    <div id="message"
         class="message">
    </div>


    <!-- Users Table -->

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="usersTableBody">

            <!-- JavaScript will populate users -->

            </tbody>

        </table>

    </div>

</main>


<!-- =========================================================
     Roles Popup
     ========================================================= -->

<div id="rolesModal"
     class="modal-overlay">


    <div class="modal">


        <!-- Modal Header -->

        <div class="modal-header">

            <h2>User Roles</h2>

            <button
                    id="closeModal"
                    class="modal-close">

                ×

            </button>

        </div>


        <!-- Modal Body -->

        <div class="modal-body">

            <p id="modalUserName"
               class="modal-user-name">
            </p>


            <div id="modalRoles"
                 class="modal-roles">

                <!-- Roles will be added by JavaScript -->

            </div>

        </div>


        <!-- Modal Footer -->

        <div class="modal-footer">

            <button
                    id="closeModalButton"
                    class="btn">

                Close

            </button>

        </div>


    </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/users.js"></script>
<script src="/js/logout.js"></script>
<script src="/js/auth-guard.js"></script>
</body>

</html>
