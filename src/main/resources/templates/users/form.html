<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User - Carpool</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div th:replace="~{fragments/navbar :: nav}"></div>

<main class="container">

    <div class="form-container">

        <h1 id="formTitle">
            Create User
        </h1>

        <form id="userForm">

            <input type="hidden"
                   id="userId">


            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                        type="text"
                        id="name"
                        required
                        minlength="2"
                        maxlength="100">

                <span id="nameError"
                      class="field-error">
                </span>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        required>

                <span id="emailError"
                      class="field-error">
                </span>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        required
                        minlength="8">

                <span id="passwordError"
                      class="field-error">
                </span>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                        type="text"
                        id="phone"
                        maxlength="10">

                <span id="phoneError"
                      class="field-error">
                </span>

            </div>

            <div class="form-group">

                <label for="roleDropdown">
                    Roles
                </label>

                <div class="multi-select"
                     id="roleDropdown">

                    <div class="multi-select-box"
                         id="roleSelectBox">

                        <div class="selected-roles"
                             id="selectedRoles">

                <span class="placeholder">
                    Select roles
                </span>

                        </div>

                        <span class="dropdown-arrow">
                ▾
            </span>

                    </div>


                    <div class="multi-select-options"
                         id="roleOptions">

                        <label class="role-option">
                            <input
                                    type="checkbox"
                                    value="DRIVER">
                            <span>DRIVER</span>
                        </label>

                        <label class="role-option">
                            <input
                                    type="checkbox"
                                    value="PASSENGER">
                            <span>PASSENGER</span>
                        </label>

                        <label class="role-option">
                            <input
                                    type="checkbox"
                                    value="ADMIN">
                            <span>ADMIN</span>
                        </label>

                    </div>

                </div>

                <span id="rolesError"
                      class="field-error">
                </span>

            </div>


            <div class="form-actions">

                <a href="/users"
                   class="btn">
                    Cancel
                </a>

                <button
                        type="submit"
                        class="btn btn-primary">
                    Save User
                </button>

            </div>

        </form>

    </div>

</main>

<script src="/js/api.js"></script>
<script src="/js/user-form.js"></script>
<script src="/js/logout.js"></script>
<script src="/js/auth-guard.js"></script>
</body>

</html>
